name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Mettre la page web dans l'appli
        run: |
          sed -e '/rel="preconnect"/d' \
              -e 's#<link rel="stylesheet" href="https://fonts.googleapis.com[^"]*">#<link rel="stylesheet" href="fonts/archivo.css">#' \
              index.html > android/app/src/main/assets/index.html
          cp icon-192.png android/app/src/main/assets/
          grep -q 'fonts/archivo.css' android/app/src/main/assets/index.html
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.MASALLE_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.MASALLE_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/masalle.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEY_PASSWORD"
          else
            echo "::warning::Pas de secret MASALLE_KEYSTORE : clé temporaire, une mise à jour demandera de réinstaller."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias masalle -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MaSalle"
          fi
          echo "::add-mask::$PASS"
          echo "MASALLE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "MASALLE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Construire l'APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Publier MaSalle.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MaSalle.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "MaSalle pour Android" --notes "Télécharge MaSalle.apk sur ton téléphone puis installe-le." --latest
          gh release upload apk MaSalle.apk --clobber
